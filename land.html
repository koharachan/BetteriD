<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>OpenStreetMap OAuth</title>
    </head>
    <body>
        <script>
            (async () => {
                const params = new URLSearchParams(location.search);
                const flowKey = 'betterid.oauth.root';
                const storedFlow = sessionStorage.getItem(flowKey);

                if (!storedFlow) {
                    if (params.has('code') || params.has('error')) {
                        new BroadcastChannel('osm-api-auth-complete').postMessage(location.href);
                        window.close();
                    }
                    return;
                }

                function showError(message) {
                    document.body.style.fontFamily = 'system-ui, sans-serif';
                    document.body.style.padding = '32px';
                    const title = document.createElement('h1');
                    title.textContent = 'OpenStreetMap 授权失败';
                    const detail = document.createElement('p');
                    detail.textContent = message;
                    const link = document.createElement('a');
                    link.href = '/';
                    link.textContent = '返回 OpenStreetMap';
                    document.body.replaceChildren(title, detail, link);
                }

                try {
                    const flow = JSON.parse(storedFlow);
                    if (Date.now() - Number(flow.createdAt) > 10 * 60 * 1000) {
                        throw new Error('授权请求已过期，请返回后重新登录。');
                    }
                    if (!params.get('state') || params.get('state') !== flow.state) {
                        throw new Error('授权状态校验失败，请返回后重试。');
                    }
                    if (params.has('error')) {
                        throw new Error(params.get('error_description') || params.get('error'));
                    }
                    if (!params.get('code')) {
                        throw new Error('OpenStreetMap 没有返回授权码。');
                    }

                    const tokenRequest = new URLSearchParams({
                        client_id: flow.clientId,
                        redirect_uri: flow.redirectUri,
                        grant_type: 'authorization_code',
                        code: params.get('code'),
                        code_verifier: flow.verifier
                    });
                    const response = await fetch('/oauth2/token', {
                        method: 'POST',
                        headers: {
                            Accept: 'application/json',
                            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                        },
                        body: tokenRequest
                    });
                    const token = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        const reason = token.error_description || token.error;
                        throw new Error(reason
                            ? `令牌交换失败：${reason}`
                            : `令牌交换失败（HTTP ${response.status}），请重新授权。`);
                    }

                    if (!token.access_token) throw new Error('OpenStreetMap 没有返回访问令牌。');
                    localStorage.setItem(location.origin + 'oauth2_access_token', token.access_token);
                    sessionStorage.removeItem(flowKey);

                    const returnTo = typeof flow.returnTo === 'string' && flow.returnTo.startsWith('/id/')
                        ? flow.returnTo
                        : '/id/';
                    location.replace(returnTo);
                } catch (error) {
                    showError(error?.message || '请返回后重试。');
                }
            })();
        </script>
    </body>
</html>
