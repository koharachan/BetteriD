<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>正在连接 OpenStreetMap</title>
  <style>
    html, body { min-height: 100%; }
    body { display: grid; place-items: center; margin: 0; padding: 24px; color: #17202a; background: #f5f7f8; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); padding: 34px; border: 1px solid #e0e5eb; border-radius: 22px; background: #fff; box-shadow: 0 24px 64px rgba(15, 23, 42, .14); text-align: center; }
    .mark { display: grid; width: 54px; height: 54px; margin: 0 auto 20px; place-items: center; border-radius: 17px; color: #2f7d32; background: #e8f5e7; }
    .mark svg { width: 30px; height: 30px; }
    h1 { margin: 0 0 9px; font-size: 21px; line-height: 1.3; }
    p { margin: 0; color: #667085; font-size: 14px; line-height: 1.6; }
    .spinner { width: 22px; height: 22px; margin: 22px auto 0; border: 3px solid #dcebd9; border-top-color: #438f40; border-radius: 50%; animation: spin .8s linear infinite; }
    a { display: inline-block; margin-top: 20px; color: #2f7d32; font-weight: 650; }
    [hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.9 12h16.2M12 3.75c2.05 2.26 3.15 5.01 3.15 8.25S14.05 18 12 20.25C9.95 18 8.85 15.24 8.85 12S9.95 6 12 3.75Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg>
    </div>
    <h1 id="status-title">正在连接 OpenStreetMap</h1>
    <p id="status-copy">即将前往官网完成安全授权，BetteriD 不会接触你的密码。</p>
    <div id="spinner" class="spinner" aria-label="正在加载"></div>
    <a id="back-link" href="/" hidden>返回 OpenStreetMap</a>
  </main>
  <script>
    (() => {
      const clientId = __BETTERID_OAUTH_CLIENT_ID__;
      const officialOrigin = __BETTERID_OSM_ORIGIN__;
      const configuredRedirectUri = __BETTERID_OAUTH_REDIRECT_URI__;
      const flowKey = 'betterid.oauth.root';

      function base64url(bytes) {
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary).replace(/\//g, '_').replace(/\+/g, '-').replace(/=+$/, '');
      }

      function showError(message) {
        document.getElementById('status-title').textContent = '无法开始授权';
        document.getElementById('status-copy').textContent = message;
        document.getElementById('spinner').hidden = true;
        document.getElementById('back-link').hidden = false;
      }

      async function start() {
        if (!clientId || !window.crypto?.subtle) throw new Error('浏览器不支持安全的 PKCE 授权流程。');

        const verifier = base64url(window.crypto.getRandomValues(new Uint8Array(32)));
        const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const challenge = base64url(new Uint8Array(digest));
        const state = base64url(window.crypto.getRandomValues(new Uint8Array(24)));
        const redirectUri = configuredRedirectUri || window.location.origin + '/id/land.html';

        const source = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams();
        if (source.get('map')) hash.set('map', source.get('map'));
        hash.set('background', 'EsriWorldImagery');
        hash.set('disable_features', 'boundaries');
        const returnTo = '/id/#' + hash.toString();

        window.sessionStorage.setItem(flowKey, JSON.stringify({
          state,
          verifier,
          clientId,
          redirectUri,
          returnTo,
          createdAt: Date.now()
        }));

        const authorize = new URL('/oauth2/authorize', officialOrigin);
        authorize.searchParams.set('client_id', clientId);
        authorize.searchParams.set('redirect_uri', redirectUri);
        authorize.searchParams.set('response_type', 'code');
        authorize.searchParams.set('scope', 'read_prefs write_prefs write_api read_gpx write_notes');
        authorize.searchParams.set('state', state);
        authorize.searchParams.set('code_challenge', challenge);
        authorize.searchParams.set('code_challenge_method', 'S256');
        authorize.searchParams.set('locale', navigator.language || 'zh-CN');
        window.location.replace(authorize.toString());
      }

      start().catch(error => showError(error?.message || '请返回后重试。'));
    })();
  </script>
</body>
</html>
