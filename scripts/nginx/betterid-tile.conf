# Dedicated tile proxy for wap.map.osm.asia
#
# The CDN site for wap.map.osm.asia fetches from this host on port 8964 (http)
# and caches by directory: /long/ 30d, /mid/ 7d, /short/ 8h. The real work is
# done by the BetteriD tile proxy on 127.0.0.1:9180 (its own disk cache, OSM
# upstream, /tile/proxy for third-party imagery).

server {
    listen 8964 default_server;
    listen [::]:8964 default_server;
    server_name wap.map.osm.asia _;

    access_log /var/log/nginx/betterid-tile.access.log;
    error_log  /var/log/nginx/betterid-tile.error.log;

    client_max_body_size 4m;

    # immutable map tiles (OpenStreetMap raster, fixed z/x/y)
    location /long/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Tile-Bucket long always;
        proxy_pass http://127.0.0.1:9180/tile/;
        include /etc/nginx/snippets/betterid-tile-proxy.conf;
    }

    # imagery that providers re-publish (aerial / satellite)
    location /mid/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Tile-Bucket mid always;
        proxy_pass http://127.0.0.1:9180/tile/;
        include /etc/nginx/snippets/betterid-tile-proxy.conf;
    }

    # anything that may change
    location /short/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=28800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Tile-Bucket short always;
        proxy_pass http://127.0.0.1:9180/tile/;
        include /etc/nginx/snippets/betterid-tile-proxy.conf;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # this host only serves tiles
    location / {
        return 404;
    }
}
